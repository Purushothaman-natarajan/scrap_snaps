[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "scrap-snaps"
version = "0.1.0"
description = "Autonomous Product Research Agent powered by LangGraph"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "langgraph>=0.0.39",
    "langchain-core>=0.1.45",
    "langchain-google-genai>=1.0.3",
    "duckduckgo-search>=5.3.0",
    "beautifulsoup4>=4.12.3",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "pillow>=10.3.0",
    "imagehash>=4.3.1",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.29",
    "python-dotenv>=1.0.1",
    "playwright>=1.40.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[project.scripts]
scrap-snaps = "src.main:main"

[project.urls]
Homepage = "https://github.com/Purushothaman-natarajan/scrap_snaps"
Repository = "https://github.com/Purushothaman-natarajan/scrap_snaps"
Issues = "https://github.com/Purushothaman-natarajan/scrap_snaps/issues"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
